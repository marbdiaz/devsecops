name: Pipeline DevSecOps - Aula Pratica

# Define o gatilho: a esteira roda toda vez que houver um push na branch main
on:
  push:
    branches: [ "main" ]

jobs:
  seguranca:
    runs-on: ubuntu-latest

    steps:
    # 1. Faz o clone do código do repositório para o servidor do GitHub
    - name: Checkout do Código
      uses: actions/checkout@v3

    # 2. Prepara o ambiente Python
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Instala as ferramentas de segurança (Bandit para SAST e pip-audit para SCA)
    - name: Instalar Ferramentas de Segurança
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    # 4. Executa a análise estática (SAST)
    - name: SAST - Analisar código fonte (Bandit)
      run: |
        echo "Iniciando varredura no código Python..."
        bandit -r . -f custom

    # 5. Executa a análise de dependências (SCA)
    # Obs: Só rodará se o passo anterior passar (o que não vai acontecer na 1ª vez)
    - name: SCA - Analisar bibliotecas de terceiros (pip-audit)
      run: |
        echo "Iniciando auditoria no requirements.txt..."
        pip-audit -r requirements.txt